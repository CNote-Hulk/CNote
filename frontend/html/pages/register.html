<!DOCTYPE html>
<html lang="ro">
<head>
    <!-- ===========================

         =========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creează cont — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Creează Cont — Console Notebook</title>
    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
                        <button class="navbar-search-btn" aria-label="Caută" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo">Console Notebook</a>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="invata.html">Învață</a></li>
                <li><a href="evolutie.html">Evoluție</a></li>
                <li><a href="comparatie.html">Comparație</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="bibliografie.html">Bibliografie</a></li>
                <li><a href="community.html">Comunitate</a></li>
            </ul>

            
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profil" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title">Creează Cont</h1>
            <p class="auth-card__subtitle">Înregistrează-te pentru a-ți urmări progresul</p>
            
            <div class="auth-error" id="register-error"></div>
            <div class="auth-error" id="register-success" style="color: var(--success); background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.2);"></div>
            
            <form class="auth-form" id="register-form" autocomplete="on">
                <div class="auth-field">
                    <label for="reg-username">Nume utilizator</label>
                    <input type="text" id="reg-username" name="username" required autocomplete="username" placeholder="Numele tău">
                </div>
                <div class="auth-field">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" required autocomplete="email" placeholder="exemplu@email.com">
                </div>
                <div class="auth-field">
                    <label for="reg-password">Parolă</label>
                    <input type="password" id="reg-password" name="new-password" required autocomplete="new-password" placeholder="Minim 6 caractere" minlength="6">
                </div>
                <button type="submit" class="auth-btn">Creează Cont</button>
            </form>

            <div class="auth-separator" style="display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--color-border, #333);">
                <span style="color: var(--color-text-muted, #888); font-size: 0.85rem;">sau</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--color-border, #333);">
            </div>

            <button type="button" id="google-register-btn" class="auth-btn" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: #fff; color: #333; border: 1px solid #ddd;">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Înregistrează-te cu Google
            </button>
            
            <p class="auth-link">Ai deja cont? <a href="login.html">Conectare</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module">
        import { AuthModule } from '../../js/modules/auth.js';
        
        // Redirect if already logged in
        if (AuthModule.isLoggedIn()) {
            window.location.href = 'profil.html';
        }
        
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorEl.classList.remove('visible');
            if (successEl) successEl.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Se creează contul...';

            try {
                const result = await AuthModule.register(username, email, password);
                if (result.success) {
                    if (successEl) {
                        successEl.textContent = (result.message || 'Cont creat!') + ' Redirecționare...';
                        successEl.classList.add('visible');
                    }
                    errorEl.classList.remove('visible');
                    e.target.reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
                } else {
                    errorEl.textContent = result.error;
                    errorEl.classList.add('visible');
                }
            } catch {
                errorEl.textContent = 'Nu s-a putut contacta serverul.';
                errorEl.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Creează Cont';
            }
        });

        // ─── Google register ──────────────────────────────
        document.getElementById('google-register-btn').addEventListener('click', () => {
            AuthModule.loginWithGoogle();
        });
    </script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
