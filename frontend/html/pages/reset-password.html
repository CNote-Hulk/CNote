<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         RESET PASSWORD PAGE
         Set a new password using reset token
         =========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>New Password — Console Notebook</title>
    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
            <button class="navbar-search-btn" aria-label="Search" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo">Console Notebook</a>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="community.html">Community</a></li>
                <li><a href="invata.html">Learn</a></li>
                <li><a href="evolutie.html">Evolution</a></li>
                <li><a href="comparatie.html">Compare</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profile" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div id="reset-form-section">
                <h1 class="auth-card__title">New Password</h1>
                <p class="auth-card__subtitle">Enter your new password.</p>

                <div class="auth-error" id="reset-error"></div>

                <form class="auth-form" id="reset-password-form">
                    <div class="auth-field">
                        <label for="new-password">New password</label>
                        <input type="password" id="new-password" name="new-password" required autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6">
                    </div>
                    <div class="auth-field">
                        <label for="new-password-confirm">Confirm password</label>
                        <input type="password" id="new-password-confirm" name="new-password-confirm" required autocomplete="new-password" placeholder="Repeat new password" minlength="6">
                    </div>
                    <button type="submit" class="auth-btn" id="reset-submit-btn">Reset Password</button>
                </form>
            </div>

            <div id="reset-success" hidden>
                <h1 class="auth-card__title">✅ Password Reset</h1>
                <p class="auth-card__subtitle" id="reset-success-msg">Your password has been changed successfully.</p>
                <a href="login.html" class="auth-btn" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">Log in</a>
            </div>

            <div id="reset-invalid" hidden>
                <h1 class="auth-card__title">❌ Invalid Link</h1>
                <p class="auth-card__subtitle" id="reset-invalid-msg">Reset link is missing or invalid.</p>
                <a href="request-password-reset.html" class="auth-btn" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">Request New Link</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/pages/reset-password.js"></script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
