<body>

    <div class="auth-page">
        <div class="auth-card">
            <div id="reset-form-section">
                <h1 class="auth-card__title">ParolÄƒ NouÄƒ</h1>
                <p class="auth-card__subtitle">Introdu noua ta parolÄƒ.</p>

                <div class="auth-error" id="reset-error"></div>

                <form class="auth-form" id="reset-password-form">
                    <div class="auth-field">
                        <label for="new-password">ParolÄƒ nouÄƒ</label>
                        <input type="password" id="new-password" name="new-password" required autocomplete="new-password" placeholder="Minim 6 caractere" minlength="6">
                    </div>
                    <div class="auth-field">
                        <label for="new-password-confirm">ConfirmÄƒ parola</label>
                        <input type="password" id="new-password-confirm" name="new-password-confirm" required autocomplete="new-password" placeholder="RepetÄƒ parola nouÄƒ" minlength="6">
                    </div>
                    <button type="submit" class="auth-btn" id="reset-submit-btn">ReseteazÄƒ Parola</button>
                </form>
            </div>

            <div id="reset-success" hidden>
                <h1 class="auth-card__title">âœ… ParolÄƒ ResetatÄƒ</h1>
                <p class="auth-card__subtitle" id="reset-success-msg">Parola a fost schimbatÄƒ cu succes.</p>
                <a href="login.html" class="auth-btn" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">Conectare</a>
            </div>

            <div id="reset-invalid" hidden>
                <h1 class="auth-card__title">âŒ Link Invalid</h1>
                <p class="auth-card__subtitle" id="reset-invalid-msg">Linkul de resetare lipseÈ™te sau este invalid.</p>
                <a href="request-password-reset.html" class="auth-btn" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">SolicitÄƒ Link Nou</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module">
        import { API_BASE_URL } from '../../js/config.js';

        (function() {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');

            if (!token) {
                document.getElementById('reset-form-section').hidden = true;
                document.getElementById('reset-invalid').hidden = false;
                return;
            }

            document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                var password = document.getElementById('new-password').value;
                var confirm = document.getElementById('new-password-confirm').value;
                var errorEl = document.getElementById('reset-error');
                var submitBtn = document.getElementById('reset-submit-btn');

                errorEl.classList.remove('visible');

                if (password !== confirm) {
                    errorEl.textContent = 'Parolele nu coincid.';
                    errorEl.classList.add('visible');
                    return;
                }

                if (password.length < 6) {
                    errorEl.textContent = 'Parola trebuie sÄƒ aibÄƒ minim 6 caractere.';
                    errorEl.classList.add('visible');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Se reseteazÄƒ...';

                try {
                    var res = await fetch(API_BASE_URL + '/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, newPassword: password })
                    });
                    var data = await res.json();

                    if (data.success) {
                        document.getElementById('reset-form-section').hidden = true;
                        document.getElementById('reset-success').hidden = false;
                        document.getElementById('reset-success-msg').textContent = data.message || 'Parola a fost resetatÄƒ cu succes!';
                    } else {
                        errorEl.textContent = data.error || 'A apÄƒrut o eroare.';
                        errorEl.classList.add('visible');
                    }
                } catch {
                    errorEl.textContent = 'Nu s-a putut contacta serverul. ÃŽncearcÄƒ din nou.';
                    errorEl.classList.add('visible');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ReseteazÄƒ Parola';
                }
            });
        })();
    </script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
