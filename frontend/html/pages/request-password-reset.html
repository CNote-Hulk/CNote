<!DOCTYPE html>
<html lang="ro">
<head>
    <!-- ===========================
         REQUEST PASSWORD RESET PAGE
         Form to request a password reset email
         =========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Solicită Resetare Parolă — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Resetare Parolă — Console Notebook</title>
    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
            <button class="navbar-search-btn" aria-label="Caută" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo">Console Notebook</a>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="invata.html">Învață</a></li>
                <li><a href="evolutie.html">Evoluție</a></li>
                <li><a href="comparatie.html">Comparație</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="bibliografie.html">Bibliografie</a></li>
                <li><a href="community.html">Comunitate</a></li>
            </ul>
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profil" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title">Resetare Parolă</h1>
            <p class="auth-card__subtitle">Introdu adresa de email pentru a primi un link de resetare.</p>

            <div class="auth-error" id="reset-request-error"></div>
            <div class="auth-error" id="reset-request-success" style="color: var(--success); background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.2);"></div>

            <form class="auth-form" id="request-reset-form">
                <div class="auth-field">
                    <label for="reset-email">Email</label>
                    <input type="email" id="reset-email" name="email" required autocomplete="email" placeholder="exemplu@email.com">
                </div>
                <button type="submit" class="auth-btn" id="reset-submit-btn">Trimite Link de Resetare</button>
            </form>

            <p class="auth-link"><a href="login.html">Înapoi la Autentificare</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module">
        import { API_BASE_URL } from '../../js/config.js';

        document.getElementById('request-reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const errorEl = document.getElementById('reset-request-error');
            const successEl = document.getElementById('reset-request-success');
            const submitBtn = document.getElementById('reset-submit-btn');

            errorEl.classList.remove('visible');
            successEl.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Se trimite...';

            try {
                const res = await fetch(API_BASE_URL + '/request-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    successEl.textContent = data.message || 'Verifică inbox-ul pentru linkul de resetare.';
                    successEl.classList.add('visible');
                } else {
                    errorEl.textContent = data.error || 'A apărut o eroare.';
                    errorEl.classList.add('visible');
                }
            } catch {
                errorEl.textContent = 'Nu s-a putut contacta serverul. Încearcă din nou.';
                errorEl.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Trimite Link de Resetare';
            }
        });
    </script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
