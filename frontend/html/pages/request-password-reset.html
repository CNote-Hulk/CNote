<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         REQUEST PASSWORD RESET PAGE
         Form to request a password reset email
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t)document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request password reset — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Password Reset — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
            <button class="navbar-search-btn" aria-label="Search" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo">Console Notebook</a>
<ul class="nav-links">
                <li><a href="community-welcome-page.html" data-i18n="nav_community">Community</a></li>
                <li><a href="invata.html" data-i18n="nav_learn">Learn</a></li>
                <li><a href="evolutie.html" data-i18n="nav_evolution">Evolution</a></li>
                <li><a href="comparatie.html" data-i18n="nav_compare">Compare</a></li>
                <li><a href="help.html" data-i18n="nav_help">Help</a></li>
                <li><a href="help.html#contact" data-i18n="nav_contact">Contact</a></li>
            </ul>
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profile" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title" data-i18n="reset_req_title">Reset Password</h1>
            <p class="auth-card__subtitle" data-i18n="reset_req_subtitle">Enter your email to receive a reset link.</p>

            <div class="auth-error" id="reset-request-error"></div>
            <div class="auth-error" id="reset-request-success" style="color: var(--success); background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.2);"></div>

            <form class="auth-form" id="request-reset-form">
                <div class="auth-field">
                    <label for="reset-email" data-i18n="reset_req_label_email">Email</label>
                    <input type="email" id="reset-email" name="email" required autocomplete="email" placeholder="example@email.com" data-i18n="reset_req_placeholder_email" data-i18n-attr="placeholder">
                </div>
                <button type="submit" class="auth-btn" id="reset-submit-btn" data-i18n="reset_req_btn">Send reset link</button>
            </form>

            <p class="auth-link"><a href="login.html" data-i18n="reset_req_back">Back to login</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/pages/request-password-reset.js"></script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
