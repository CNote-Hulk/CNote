<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         SETUP USERNAME PAGE
         First-time username selection
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t)document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your username — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Choose Username — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <div id="navbar-placeholder"></div>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title" data-i18n="setup_username_title">✏️ Choose your username</h1>
            <p class="auth-card__subtitle" data-i18n="setup_username_subtitle">Pick a unique username to complete your account setup</p>

            <div class="auth-error" id="setup-error"></div>
            <div class="auth-success" id="setup-success"></div>

            <form class="auth-form" id="setup-username-form" autocomplete="off">
                <div class="auth-field">
                    <label for="setup-username" data-i18n="setup_username_label">👤 Username</label>
                    <input type="text" id="setup-username" name="username" required
                           minlength="3" maxlength="20"
                           pattern="^[a-zA-Z0-9_]+$"
                           placeholder="Letters, numbers, underscores (3-20 chars)"
                           data-i18n="setup_username_placeholder" data-i18n-attr="placeholder"
                           autocomplete="off">
                    <span class="username-status" id="username-status"></span>
                </div>
                <button type="submit" class="auth-btn" id="setup-submit-btn" data-i18n="setup_username_btn">✅ Set Username</button>
            </form>
        </div>
    </div>

    <script type="module" src="../../js/pages/setup-username.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
