<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         SETUP USERNAME PAGE
         First-time username selection

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your username — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Choose Username — Console Notebook</title>
    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
            <button class="navbar-search-btn" aria-label="Search" type="button" data-i18n="nav_search" data-i18n-attr="aria-label">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo" data-i18n="hero_title">Console Notebook</a>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="community.html" data-i18n="nav_community">Community</a></li>
                <li><a href="invata.html" data-i18n="nav_learn">Learn</a></li>
                <li><a href="evolutie.html" data-i18n="nav_evolution">Evolution</a></li>
                <li><a href="comparatie.html" data-i18n="nav_compare">Compare</a></li>
                <li><a href="help.html" data-i18n="nav_help">Help</a></li>
                <li><a href="index.html#contact" data-i18n="nav_contact">Contact</a></li>
            </ul>
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profile" type="button" data-i18n="navbar_profile" data-i18n-attr="aria-label">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title" data-i18n="setup_username_title">✏️ Choose your username</h1>
            <p class="auth-card__subtitle" data-i18n="setup_username_subtitle">Pick a unique username to complete your account setup</p>

            <div class="auth-error" id="setup-error"></div>
            <div class="auth-success" id="setup-success"></div>

            <form class="auth-form" id="setup-username-form" autocomplete="off">
                <div class="auth-field">
                    <label for="setup-username" data-i18n="setup_username_label">👤 Username</label>
                    <input type="text" id="setup-username" name="username" required
                           minlength="3" maxlength="20"
                           pattern="^[a-zA-Z0-9_]+$"
                           placeholder="Letters, numbers, underscores (3-20 chars)"
                           data-i18n="setup_username_placeholder" data-i18n-attr="placeholder"
                           autocomplete="off">
                    <span class="username-status" id="username-status"></span>
                </div>
                <button type="submit" class="auth-btn" id="setup-submit-btn" data-i18n="setup_username_btn">✅ Set Username</button>
            </form>
        </div>
    </div>

    <script type="module" src="../../js/pages/setup-username.js"></script>
    <script type="module" src="../../js/main.js"></script>
</body>
</html>
