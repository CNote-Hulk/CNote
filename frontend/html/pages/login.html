<!DOCTYPE html>
<html lang="ro">
<head>
    <!-- ===========================
         LOGIN PAGE
         User authentication form
         =========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Autentificare — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <title>Autentificare — Console Notebook</title>
    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
                        <button class="navbar-search-btn" aria-label="Caută" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo">Console Notebook</a>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="invata.html">Învață</a></li>
                <li><a href="evolutie.html">Evoluție</a></li>
                <li><a href="comparatie.html">Comparație</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="bibliografie.html">Bibliografie</a></li>
            </ul>

            
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profil" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h1 class="auth-card__title">Autentificare</h1>
            <p class="auth-card__subtitle">Intră în contul tău Console Notebook</p>

            <!-- Tab switcher -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="server">Online</button>
                <button class="auth-tab" data-tab="local">Local</button>
            </div>
            
            <!-- SERVER LOGIN -->
            <div class="auth-tab-panel active" id="tab-server">
                <div class="auth-error" id="login-error"></div>
                
                <form class="auth-form" id="login-form" autocomplete="on">
                    <div class="auth-field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="exemplu@email.com">
                    </div>
                    <div class="auth-field">
                        <label for="login-password">Parolă</label>
                        <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Minim 6 caractere">
                    </div>
                    <button type="submit" class="auth-btn">Conectare</button>
                </form>

                <p class="auth-link"><a href="request-password-reset.html">Ai uitat parola?</a></p>
                <p class="auth-link">Nu ai cont? <a href="register.html">Creează cont</a></p>
            </div>

            <!-- LOCAL LOGIN -->
            <div class="auth-tab-panel" id="tab-local">
                <p class="auth-tab-info">Mod offline — datele se salvează doar pe acest dispozitiv.</p>
                <div class="auth-error" id="local-login-error"></div>
                
                <form class="auth-form" id="local-login-form" autocomplete="off">
                    <div class="auth-field">
                        <label for="local-username">Nume utilizator</label>
                        <input type="text" id="local-username" name="username" required placeholder="Numele tău">
                    </div>
                    <button type="submit" class="auth-btn">Intră local</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js"></script>
    <script type="module">
        import { AuthModule } from '../../js/modules/auth.js';
        
        // Auto-login: check if token is still valid
        (async () => {
            const user = await AuthModule.autoLogin();
            if (user) {
                window.location.href = 'profil.html';
                return;
            }
        })();

        // ─── Tab switching ──────────────────────────────
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ─── Server login ───────────────────────────────
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorEl.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Se conectează...';

            try {
                const result = await AuthModule.login(email, password);
                if (result.success) {
                    window.location.href = 'profil.html';
                } else {
                    errorEl.textContent = result.error;
                    errorEl.classList.add('visible');
                }
            } catch {
                errorEl.textContent = 'Nu s-a putut contacta serverul.';
                errorEl.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Conectare';
            }
        });

        // ─── Local login ────────────────────────────────
        document.getElementById('local-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('local-username').value.trim();
            const errorEl = document.getElementById('local-login-error');

            errorEl.classList.remove('visible');

            if (!username) {
                errorEl.textContent = 'Introdu un nume de utilizator.';
                errorEl.classList.add('visible');
                return;
            }

            AuthModule.localLogin(username);
            window.location.href = 'profil.html';
        });
    </script>
    <script src="../../js/fallback/hamburger.js" defer></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
</html>
