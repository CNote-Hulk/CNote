<head>
    <!-- ===========================
         COMPARISON PAGE
         Dynamic console comparison with specs analysis
         =========================== -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare any two gaming consoles - specs, performance and verdict">
    <meta name="theme-color" content="#1B1714">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">

    <link rel="stylesheet" href="../../css/production.css">
</head>
<body>
    <!-- ===========================
         NAVIGATION BAR
         =========================== -->
    <nav class="navbar">
        <div class="container">
                        <button class="navbar-search-btn" aria-label="Search" type="button" data-i18n="nav_search" data-i18n-attr="aria-label">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <a href="index.html" class="logo" data-i18n="hero_title">Console Notebook</a>
            
            <!-- Hamburger Button - Mobile Only -->
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-links">
                <li><a href="community.html" data-i18n="nav_community">Community</a></li>
                <li><a href="invata.html" data-i18n="nav_learn">Learn</a></li>
                <li><a href="evolutie.html" data-i18n="nav_evolution">Evolution</a></li>
                <li><a href="comparatie.html" class="active" data-i18n="nav_compare">Compare</a></li>
                <li><a href="index.html#contact" data-i18n="nav_contact">Contact</a></li>
            </ul>

            
            <div class="navbar-profile-wrap">
                <button class="navbar-profile-btn" aria-label="Profil" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- ===========================
         HERO SECTION
         =========================== -->
    <section class="hero hero-cinematic hero-comparatie">
        <div class="hero-content">
            <h1 data-i18n="compare_hero_title">Compare Consoles</h1>
            <p data-i18n="compare_hero_subtitle">Select two models and see the hardware differences that matter</p>
            <a href="#content" class="hero-button" data-i18n="compare_hero_cta">Explore hardware</a>
        </div>
    </section>

    <!-- ===========================
         CONSOLE SELECTOR
         Dropdowns for choosing Console A vs Console B
         Populated dynamically by comparatie.js
         =========================== -->
    <section class="section selector-section" id="content">
        <div class="container">
            <div class="selector-grid">
                <div class="selector-box">
                    <label for="console-a-select" class="selector-label">
                        <span class="selector-badge">A</span>
                        <span data-i18n="selector_label_a">Console A</span>
                    </label>
                    <select id="console-a-select" class="console-select">
                        <option value="" selected data-i18n="selector_default_a">Choose console A</option>
                    </select>
                </div>

                <div class="selector-vs">
                    <span data-i18n="selector_vs">VS</span>
                </div>

                <div class="selector-box">
                    <label for="console-b-select" class="selector-label">
                        <span class="selector-badge">B</span>
                        <span data-i18n="selector_label_b">Console B</span>
                    </label>
                    <select id="console-b-select" class="console-select">
                        <option value="" selected data-i18n="selector_default_b">Choose console B</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- ===========================
         DYNAMIC COMPARISON DISPLAY
         Shows console cards, specs grid, and verdict
         Generated by comparatie.js based on selected consoles
         =========================== -->
    <section class="section comparison-section">
        <div class="container">
            <div id="comparison-display" class="comparison-display"></div>
        </div>
    </section>

    <!-- Footer -->
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner container">
            <div class="footer-left">
                <p class="footer-main"> 2026 Console Notebook</p>
            </div>
            <div class="footer-right">
                <a href="mailto:console.notebook.app@gmail.com">console.notebook.app@gmail.com</a>
                <a href="tel:+40758464907">+40 758 464 907</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/pages/comparatie.js"></script>
    
    <!-- Fallback Script (funcționează fără server HTTP) -->
    <script src="../../js/data/consoles-data.js"></script>
    <script src="../../js/fallback/comparatie.js"></script>

    <!-- Hamburger Menu Fallback -->
    <script src="../../js/fallback/hamburger.js"></script>
    <script src="../../js/fallback/search-profile.js"></script>
</body>
