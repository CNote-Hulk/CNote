name: Database Backup

# Daily encrypted pg_dump of the production Supabase database, kept as a
# GitHub Actions artifact. Independent of whatever backup/PITR Supabase's
# own plan does or doesn't include — a second, portable copy we control.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL                 — production Postgres connection string
#   BACKUP_ENCRYPTION_PASSPHRASE — a long random passphrase (e.g. from
#                                  `openssl rand -base64 48`); needed to
#                                  decrypt a restore later, so store it
#                                  somewhere safe outside GitHub too.
#
# To restore from a downloaded artifact:
#   gpg --batch --yes --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" \
#       --decrypt backup.sql.gz.gpg > backup.sql.gz
#   gunzip backup.sql.gz
#   psql "$DATABASE_URL" < backup.sql

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily — off-peak, avoids the :00 stampede
  workflow_dispatch: {} # allows manually triggering a backup on demand

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pg_dump "$DATABASE_URL" | gzip > backup.sql.gz

      - name: Encrypt dump
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" \
              --output backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 90
