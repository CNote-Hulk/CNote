# Console Notebook — self-hosted chat attachment storage (MinIO)
# Deploy on a fresh VPS. See infra/README.md for the full step-by-step.
#
# Two services:
#   minio  — S3-compatible object storage, holds chat images + voice messages
#   caddy  — reverse proxy with automatic Let's Encrypt TLS in front of MinIO
#
# Copy infra/.env.example to infra/.env and fill in real values before
# running `docker compose up -d`.

services:
  minio:
    image: minio/minio:latest
    container_name: cnote-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: cnote-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - minio

volumes:
  minio-data:
    driver: local
  caddy-data:
  caddy-config:
