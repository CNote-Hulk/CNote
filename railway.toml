[build]
builder = "RAILPACK"
buildEnvironment = "V3"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
runtime = "V2"
numReplicas = 1
sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10